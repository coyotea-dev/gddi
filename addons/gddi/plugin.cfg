[plugin]

name="GDDI"
description="GDDI (Godot Dependency Injection) is a stupidly simple lightweight service locator and dependency injection framework for Godot Engine.
Built directly on Godot's built-in Engine singleton system, it lets you easily manage game services, lazy singletons, nodes, and factory instantiations through a clear provide and inject API."
author="Coyotea"
version="1.0.0"
script="plugin.gd"
